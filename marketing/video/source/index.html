<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<title>Sunai video</title>
<script src="icons.js"></script>
<script src="timeline.js"></script>
<style>
:root{
  --green:#15803D;--green-soft:#DCFCE7;--green-ring:#BBF7D0;--green-text:#14532D;
  --red:#B91C1C;--red-ring:#FECACA;
  --blue:#1D4ED8;--blue-soft:#DBEAFE;--blue-ring:#93C5FD;
  --amber:#B45309;--amber-soft:#FEF3C7;--amber-ring:#FDE68A;--amber-text:#78350F;
  --ink:#0F172A;--muted:#475569;--nav-idle:#334155;--line:#CBD5E1;--track:#E2E8F0;--toggle-off:#94A3B8;
  --ground:#F1F5F9;--white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
body{font-family:"Noto Sans Devanagari","Noto Sans",sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#F8FAFC 0%,#F1F5F9 55%,#E8EEF5 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.scene{position:absolute;inset:0;opacity:0;display:none}
.ic{display:inline-block;flex:none}
.ic svg{width:100%;height:100%;display:block;overflow:visible}

/* left copy */
.copy{position:absolute;left:150px;top:0;bottom:150px;width:820px;display:flex;flex-direction:column;justify-content:center}
.kicker{align-self:flex-start;font-size:30px;font-weight:700;padding:8px 26px;border-radius:40px;margin-bottom:26px}
.h1{font-size:84px;line-height:1.25;font-weight:800;letter-spacing:-.5px}
.sub{font-size:40px;line-height:1.5;color:var(--muted);margin-top:22px;font-weight:500}
.chiprow{display:flex;gap:18px;margin-top:38px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:14px;font-size:32px;font-weight:700;padding:14px 26px;border-radius:22px;background:#fff;box-shadow:0 6px 20px rgba(15,23,42,.08)}

/* phone */
.phone{position:absolute;left:1180px;top:58px;width:396px;height:812px;border-radius:58px;background:#111827;padding:15px;
  box-shadow:0 40px 80px rgba(15,23,42,.25),0 0 0 2px #374151 inset}
.phone .notch{position:absolute;top:24px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#000;z-index:5}
.screen{width:366px;height:782px;border-radius:44px;overflow:hidden;background:var(--ground);position:relative}
.dp{position:absolute;left:3px;top:0;width:360px;height:782px;display:flex;flex-direction:column}
.sbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:14px;font-weight:700;color:var(--ink)}
.sbar .r{display:flex;gap:6px;align-items:center}
.batt{width:24px;height:12px;border:2px solid var(--ink);border-radius:3px;position:relative}
.batt i{position:absolute;left:1px;top:1px;bottom:1px;width:70%;background:var(--ink);border-radius:1px}
.sig{display:flex;gap:2px;align-items:flex-end;height:12px}.sig i{width:3px;background:var(--ink);border-radius:1px}

.toprow{display:flex;align-items:center;padding:8px 18px 0}
.flex1{flex:1}
.pill{height:56px;border-radius:28px;background:#fff;border:2px solid var(--green);display:flex;align-items:center;padding:0 14px 0 10px;gap:8px}
.dotc{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.voicebtn{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--amber-soft);border:4px solid var(--amber-soft);color:var(--amber-text);position:relative}
.voicebtn b{font-size:12px;line-height:1.2}
.ring{position:absolute;border-radius:50%;border:4px solid var(--amber);pointer-events:none}
.back{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{width:250px;height:250px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:14px solid var(--red-ring);background:#fff}
.meter{height:34px;margin-top:12px;display:flex;align-items:center}
.meter i{width:7px;margin:0 2.5px;border-radius:4px;background:var(--line);height:6px}
.state{font-size:28px;font-weight:800;margin-top:6px;color:var(--red)}
.card{background:#fff;border-radius:22px;padding:14px}
.volcard{margin:0 18px;display:flex;align-items:center}
.vbtn{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.vbars{flex:1;height:64px;margin:0 12px;display:flex;align-items:flex-end}
.vbars i{flex:1;margin:0 3px;border-radius:8px;background:var(--track)}
.places{height:96px;margin:12px 13px 14px;display:flex}
.tile{flex:1;margin:0 5px;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.tile b{font-size:15px;line-height:1.5}
.nav{background:#fff;display:flex;padding:8px 10px 14px}
.navi{flex:1;height:64px;margin:0 4px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--nav-idle)}
.navi b{font-size:14px;line-height:1.3}
.navi.on{background:var(--green-soft);color:var(--green-text)}

/* test */
.ears{height:120px;margin:8px 13px 0;display:flex}
.ears .tile{border-radius:26px;color:var(--muted)}
.ears .tile b{font-size:15px}
.tdots{display:flex;justify-content:center;margin-top:16px}
.tdots i{width:28px;height:28px;border-radius:50%;margin:0 5px;background:var(--line)}
.play{width:200px;height:200px;border-radius:50%;border:14px solid var(--blue-soft);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.yn{height:120px;display:flex;margin:0 18px 20px}
.yn .tile{margin:0;color:#fff;border-radius:28px}
.yn .tile b{font-size:18px}

/* connect */
.chain{margin:8px 18px 0;padding:20px 14px;display:flex;align-items:center}
.cdots{flex:1;display:flex;justify-content:center}.cdots i{width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--line)}
.steps{display:flex;margin:14px 13px 0}
.steps .tile{padding:12px 0;font-size:12px}
.steps .tile b{font-size:14px;margin-top:6px}
.cbtn{width:170px;height:170px;border-radius:50%;background:var(--blue);border:12px solid var(--blue-soft);display:flex;align-items:center;justify-content:center;color:#fff}
.cword{font-size:22px;font-weight:800;margin-top:12px}
.speed{margin:0 18px 14px;display:flex;align-items:center}
.wired{margin:0 18px 20px;background:var(--green-soft);border-radius:22px;padding:12px;display:flex;align-items:center;color:var(--green-text);font-size:15px;font-weight:700}

/* helper */
.htitle{padding:6px 22px 0}
.htitle h2{font-size:24px;font-weight:800;line-height:1.3}
.htitle p{font-size:13px;color:var(--muted)}
.hcard{margin:10px 18px 0}
.hlabel{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.lang{height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;background:var(--ground);border:2px solid var(--track)}
.lang.on{background:var(--amber);border-color:var(--amber);color:#fff}
.bal{display:flex;align-items:center;margin-top:10px}
.balbtn{width:52px;height:52px;border-radius:50%;border:3px solid var(--blue);display:flex;align-items:center;justify-content:center;background:#fff}
.baltrack{flex:1;margin:0 10px;height:32px;position:relative}
.baltrack .l{position:absolute;left:0;right:0;top:9px;height:14px;border-radius:7px;background:var(--track)}
.baltrack .k{position:absolute;top:0;width:32px;height:32px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.trow{display:flex;align-items:center;margin-top:12px}
.trow .ib{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.trow .tx{flex:1;margin:0 8px 0 12px}
.trow .tx h4{font-size:16px;font-weight:700;line-height:1.35}
.trow .tx p{font-size:12.5px;color:var(--muted);line-height:1.35}
.tog{width:68px;height:40px;border-radius:20px;padding:4px;background:var(--toggle-off);position:relative}
.tog i{position:absolute;top:4px;width:32px;height:32px;border-radius:50%;background:#fff}

/* taps */
.tap{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(15,23,42,.22);border:4px solid rgba(255,255,255,.95);box-shadow:0 4px 18px rgba(0,0,0,.25);pointer-events:none;display:none;z-index:50}

/* subtitles */
#subs{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;z-index:100}
#subs span{max-width:1500px;text-align:center;background:rgba(15,23,42,.86);color:#fff;font-size:38px;line-height:1.45;font-weight:600;padding:12px 34px 14px;border-radius:20px}

/* brand mark (corner) */
#mark{position:absolute;right:56px;top:40px;display:flex;align-items:center;gap:14px;font-size:34px;font-weight:800;z-index:90}
.appicon{background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff}

/* full-stage compositions */
.mid{position:absolute;inset:0 0 150px 0;display:flex;align-items:center;justify-content:center}
.node{display:flex;flex-direction:column;align-items:center;gap:26px;width:340px}
.node .c{width:230px;height:230px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(15,23,42,.12)}
.node b{font-size:40px;font-weight:800;text-align:center;line-height:1.3}
.tcard{width:440px;height:430px;border-radius:44px;background:#fff;box-shadow:0 24px 60px rgba(15,23,42,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;margin:0 30px}
.tcard .c{width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.tcard b{font-size:44px;font-weight:800;text-align:center;line-height:1.3}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div class="blob" id="blobA" style="width:900px;height:900px;left:-250px;top:-300px;background:#BBF7D0"></div>
  <div class="blob" id="blobB" style="width:800px;height:800px;right:-250px;bottom:-320px;background:#BFDBFE"></div>
  <div id="scenes"></div>
  <div id="mark"><span class="appicon" style="width:58px;height:58px;border-radius:16px"><span class="ic" style="width:58px;height:58px" data-ic="ic_launcher_foreground_raw"></span></span><span>सुनाइ</span></div>
  <div id="subs"><span></span></div>
</div>

<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const ramp=(t,a,d=.5)=>ease((t-a)/d);
const pop=(t,a,d=.55)=>back((t-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const ic=(n,c,s)=>`<span class="ic" style="color:${c};width:${s}px;height:${s}px">${ICONS[n]}</span>`;
const icf=(n,c,s,extra='')=>`<span class="ic" style="color:${c};width:${s}px;height:${s}px;${extra}">${ICONS[n]}</span>`;
const CSS=getComputedStyle(document.documentElement);
const C=n=>CSS.getPropertyValue('--'+n).trim();
const ND=['०','१','२','३','४','५','६','७','८','९'];
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ICONS[e.dataset.ic]);

// ---------------------------------------------------------------- screens (built from the app's layouts)
const sbar=`<div class="sbar"><span>१०:३०</span><span class="r"><span class="sig"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:12px"></i></span><span class="batt"><i></i></span></span></div>`;
const voiceBtn=`<div class="voicebtn"><span class="ic vi" style="width:34px;height:34px">${ICONS.ic_voice}</span><b class="vl">सुन्नुस्</b></div>`;
const navBar=sel=>`<div class="nav">${[['ic_ear','सुन्ने'],['ic_ear_check','जाँच'],['ic_helper','सहयोगी']].map(([i,w],k)=>`<div class="navi ${k==sel?'on':''}">${ic(i,'currentColor',32)}<b>${w}</b></div>`).join('')}</div>`;

function homeScreen(){return `${sbar}
<div class="toprow"><div class="pill">${ic('ic_earbud',C('ink'),34)}<span class="dotc" style="background:var(--green)">${ic('ic_check','#fff',18)}</span>${ic('ic_bolt',C('green'),26)}</div><div class="flex1"></div>${voiceBtn}</div>
<div class="center"><div class="big"><span class="ic bigon" style="width:120px;height:120px;color:#fff;display:none">${ICONS.ic_ear_on}</span><span class="ic bigoff" style="width:120px;height:120px">${ICONS.ic_ear_off_raw}</span></div>
<div class="meter">${'<i></i>'.repeat(11)}</div><div class="state">बन्द</div></div>
<div class="card volcard"><div class="vbtn vdown" style="background:#fff;border:3px solid var(--blue)">${ic('ic_vol_down',C('blue'),34)}</div>
<div class="vbars">${[1,2,3,4,5].map(i=>`<i style="height:${12+i*10}px"></i>`).join('')}</div>
<div class="vbtn vup" style="background:var(--blue)">${ic('ic_vol_up','#fff',38)}</div></div>
<div class="places">${[['ic_place_home','घर'],['ic_place_talk','कुरा'],['ic_place_crowd','भीड']].map(([i,w])=>`<div class="tile">${ic(i,'currentColor',40)}<b>${w}</b></div>`).join('')}</div>
${navBar(0)}`}
const SHAPE=[0.3,0.5,0.75,1,0.7,0.9,0.6,0.85,0.55,0.4,0.3];
function setHome(r,s){
  const on=!!s.on, big=r.querySelector('.big');
  big.style.background=on?C('green'):'#fff'; big.style.borderColor=on?C('green-ring'):C('red-ring');
  big.style.transform=`scale(${s.bigScale||1})`;
  r.querySelector('.bigon').style.display=on?'block':'none'; r.querySelector('.bigoff').style.display=on?'none':'block';
  const st=r.querySelector('.state'); st.textContent=on?'खुला':'बन्द'; st.style.color=on?C('green'):C('red');
  r.querySelectorAll('.meter i').forEach((b,i)=>{b.style.background=on?C('green'):C('line');b.style.height=(on?6+28*SHAPE[i]*(s.level||0):6)+'px'});
  r.querySelectorAll('.vbars i').forEach((b,i)=>b.style.background=i<(s.vol??3)?C('blue'):C('track'));
  r.querySelectorAll('.places .tile').forEach((t,i)=>{const sel=i==(s.place??0);t.style.background=sel?C('blue'):'#fff';t.style.color=sel?'#fff':C('ink')});
  r.querySelector('.vup').style.transform=`scale(${s.upScale||1})`;
  setVoice(r,s.speaking,s.t||0);
}
function setVoice(r,speaking,t){
  const v=r.querySelector('.voicebtn');
  v.style.background=speaking?C('amber'):C('amber-soft'); v.style.borderColor=speaking?C('amber-ring'):C('amber-soft');
  v.style.color=speaking?'#fff':C('amber-text'); r.querySelector('.vl').textContent=speaking?'बोल्दै…':'सुन्नुस्';
  r.querySelectorAll('.voicebtn .ring').forEach(e=>e.remove());
  if(speaking){for(let k=0;k<2;k++){const p=((t*0.9)+k*.5)%1;const e=document.createElement('i');e.className='ring';
    const sz=76+p*70;e.style.cssText=`width:${sz}px;height:${sz}px;left:${-4-(sz-76)/2}px;top:${-4-(sz-76)/2}px;opacity:${(1-p)*.8}`;v.appendChild(e)}}
}

function testScreen(){return `${sbar}
<div class="toprow"><div class="back">${ic('ic_back',C('ink'),32)}</div><div class="flex1"></div>${voiceBtn}</div>
<div class="ears"><div class="tile">${icf('ic_ear','currentColor',64,'transform:scaleX(-1)')}<b>बायाँ</b></div><div class="tile">${ic('ic_ear','currentColor',64)}<b>दायाँ</b></div></div>
<div class="tgroup" style="flex:1;display:flex;flex-direction:column">
 <div class="tdots">${'<i></i>'.repeat(6)}</div>
 <div style="flex:1;display:flex;align-items:center;justify-content:center"><div class="play">${ic('ic_voice','currentColor',96)}</div></div>
 <div class="yn"><div class="tile no" style="background:var(--red);margin-right:7px">${icf('ic_thumb_up','#fff',56,'transform:rotate(180deg)')}<b>सुनिनँ</b></div><div class="tile yes" style="background:var(--green);margin-left:7px">${ic('ic_thumb_up','#fff',56)}<b>सुनें</b></div></div>
</div>
<div class="dgroup" style="flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:0 18px 20px">
 <div class="dbadge" style="width:190px;height:190px;border-radius:50%;background:var(--green);border:14px solid var(--green-ring);display:flex;align-items:center;justify-content:center">${ic('ic_check','#fff',96)}</div>
 <div style="font-size:28px;font-weight:800;margin-top:18px">मिलाइयो</div>
 <div style="display:flex;width:100%;height:96px;margin-top:18px"><div class="tile" style="margin:0 7px 0 0;border:3px solid var(--line);border-radius:26px">${ic('ic_retry',C('ink'),40)}<b>फेरि</b></div><div class="tile" style="margin:0 0 0 7px;background:var(--blue);color:#fff;border-radius:26px">${ic('ic_arrow','#fff',40)}<b>अगाडि</b></div></div>
</div>`}
function setTest(r,s){
  r.querySelectorAll('.ears .tile').forEach((t,i)=>{const sel=i==(s.ear||0);t.style.background=sel?C('blue'):'#fff';t.style.color=sel?'#fff':C('muted')});
  const done=s.step>=6;
  r.querySelector('.tgroup').style.display=done?'none':'flex'; r.querySelector('.dgroup').style.display=done?'flex':'none';
  r.querySelector('.dbadge').style.transform=`scale(${s.doneScale??1})`;
  r.querySelectorAll('.tdots i').forEach((d,i)=>{d.style.background=i<s.step?C('green'):i==s.step?'#fff':C('line');d.style.border=i==s.step?`5px solid ${C('blue')}`:'none'});
  const p=r.querySelector('.play'); p.style.background=s.playing?C('blue'):'#fff'; p.style.borderColor=s.playing?C('blue-ring'):C('blue-soft'); p.style.color=s.playing?'#fff':C('blue');
  p.style.transform=`scale(${s.playing?1+0.03*Math.sin(s.t*18):1})`;
  r.querySelector('.yes').style.transform=`scale(${s.yesScale||1})`; r.querySelector('.no').style.transform=`scale(${s.noScale||1})`;
  setVoice(r,false,0);
}

function connectScreen(){return `${sbar}
<div class="toprow"><div class="back">${ic('ic_back',C('ink'),32)}</div><div class="flex1"></div>${voiceBtn}</div>
<div class="card chain">${ic('ic_phone',C('ink'),72)}<div class="cdots">${'<i></i>'.repeat(3)}</div><div class="btb" style="width:56px;height:56px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center">${ic('ic_bluetooth','#fff',30)}</div><div class="cdots">${'<i></i>'.repeat(3)}</div>${ic('ic_earbud',C('ink'),72)}</div>
<div class="steps">${[['●','ic_case',C('ink'),'बट्टा खोल्नुस्'],['● ●','ic_bt_circle',C('blue'),'नीलो थिच्नुस्'],['● ● ●','ic_ear_in',C('green'),'कानमा लाउनुस्']].map(([d,i,c,w])=>`<div class="tile">${d}<span style="margin-top:6px">${ic(i,c,46)}</span><b>${w}</b></div>`).join('')}</div>
<div class="center"><div class="cbtn"><span class="ic cbt" style="width:70px;height:70px">${ICONS.ic_bluetooth}</span><span class="ic cck" style="width:70px;height:70px;display:none">${ICONS.ic_check}</span></div><div class="cword">जोड्नुहोस्</div></div>
<div class="card speed" style="visibility:hidden"><div style="width:60px;height:60px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center">${ic('ic_bolt','#fff',34)}</div>
 <div style="margin-left:14px"><div style="font-size:17px;font-weight:800">छिटो — राम्रो</div><div style="font-size:13px;color:var(--muted)">यो इयरफोन ठीक छ</div></div></div>
<div class="wired">${ic('ic_wired',C('green-text'),40)}<span style="flex:1;margin-left:12px">तारवाला इयरफोन सबैभन्दा छिटो</span>${ic('ic_bolt',C('green'),30)}</div>`}
function setConnect(r,s){
  const col=s.done?C('green'):s.searching?C('blue'):C('line');
  r.querySelectorAll('.cdots i').forEach((d,i)=>{d.style.background=col; d.style.opacity=s.searching&&!s.done?(0.35+0.65*((Math.sin(s.t*7-i*0.9)+1)/2)):1});
  r.querySelector('.btb').style.background=s.done?C('green'):C('blue');
  const b=r.querySelector('.cbtn'); b.style.background=s.done?C('green'):C('blue');
  b.style.borderColor=s.done?C('green-ring'):s.searching?C('blue-ring'):C('blue-soft'); b.style.transform=`scale(${s.btnScale||1})`;
  r.querySelector('.cbt').style.display=s.done?'none':'block'; r.querySelector('.cck').style.display=s.done?'block':'none';

// waveform svg path: noisy (k=0) to clean speech (k=1)
function wave(w,h,t,k,seed=0){
  let d='';const n=120;
  for(let i=0;i<=n;i++){const x=i/n*w;const u=i/n;
    const env=Math.pow(Math.sin(Math.PI*u),1.2)*(0.55+0.45*Math.sin(u*9+t*2+seed));
    const speech=env*Math.sin(u*46+t*9)*0.9;
    const noise=(Math.sin(u*337+t*41+seed)*0.5+Math.sin(u*191-t*29)*0.5)*0.85;
    const y=h/2-(h/2-6)*(speech*k*1.0+noise*(1-k)*0.9+speech*(1-k)*0.35);
    d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
  return d}

// place a tap ripple over an element; k in [0,1] progress of the tap
function tapAt(tapEl,target,t,at){
  const k=(t-at+0.25)/0.7;
  if(k<0||k>1){tapEl.style.display='none';return}
  const r=target.getBoundingClientRect();
  tapEl.style.display='block'; tapEl.style.left=(r.left+r.width/2)+'px'; tapEl.style.top=(r.top+r.height/2)+'px';
  tapEl.style.opacity=k<.35?k/.35:1-(k-.35)/.65; tapEl.style.transform=`scale(${0.75+0.5*k})`;
}

   <div class="ou-icon appicon" style="width:230px;height:230px;border-radius:62px;box-shadow:0 30px 70px rgba(21,128,61,.35)"><span class="ic" style="width:230px;height:230px">${ICONS.ic_launcher_foreground_raw}</span></div>
   <div><div class="ou-name" style="font-size:170px;font-weight:800;line-height:1.2">सुनाइ</div><div class="ou-tag" style="font-size:52px;font-weight:700;color:var(--muted)">निःशुल्क · सानो · सबैका लागि</div></div>
  </div>
  <div class="ou-chips chiprow" style="margin-top:46px;justify-content:center">
   <div class="chip">${ic('ic_ear_on',C('green'),44)}प्रष्ट सुनाइ</div><div class="chip">${ic('ic_ear_check',C('green'),44)}कान जाँच</div><div class="chip"><span style="font:800 30px 'Noto Sans';color:var(--green)">AI</span>हल्ला सफा</div><div class="chip">${ic('ic_lock',C('ink'),40)}इन्टरनेट बिना</div></div>
  <div class="ou-med" style="margin-top:46px;display:flex;align-items:center;gap:22px;background:var(--amber-soft);border:3px solid var(--amber-ring);color:var(--amber-text);border-radius:26px;padding:20px 34px;font-size:34px;font-weight:600;max-width:1500px">${ic('ic_shield',C('amber'),56)}<span>यो चिकित्सकीय उपकरण होइन। कान दुखे, पीप आए वा अचानक सुन्न छाडे स्वास्थ्य चौकी जानुहोस्।</span></div>
 </div>`,
 render(r,t,s){
  r.querySelector('.ou-icon').style.transform=`scale(${pop(t,.05,.7)})`;
  const n=r.querySelector('.ou-name');n.style.opacity=ramp(t,.3,.5);
  r.querySelector('.ou-tag').style.opacity=ramp(t,s.vo+s.subs[0][1],.5);
  const c=r.querySelector('.ou-chips');c.style.opacity=ramp(t,s.vo+s.subs[1][0],.5);
  r.querySelector('.ou-med').style.opacity=ramp(t,s.vo+s.subs[2][0],.5);
 }};

// ---------------------------------------------------------------- build + render(t)
TL.scenes.forEach(s=>{s.el=sceneRoot(s.id,SC[s.id].html)});
const FADE=0.45;
const NOMARK={intro:1,outro:1};
const BLOBS={hook:['#FECACA','#E2E8F0'],intro:['#BBF7D0','#BBF7D0'],how:['#BBF7D0','#BFDBFE'],home:['#BBF7D0','#BFDBFE'],places:['#BFDBFE','#BBF7D0'],test:['#BBF7D0','#FECACA'],connect:['#BFDBFE','#BBF7D0'],voice:['#FDE68A','#FEF3C7'],trust:['#E2E8F0','#FDE68A'],helper:['#E2E8F0','#BFDBFE'],outro:['#BBF7D0','#FDE68A']};
function render(T){
  let cur=null;
  TL.scenes.forEach((s,i)=>{
    const lt=T-s.start, vis=lt>=-0.001&&lt<s.dur+FADE&&!(i==TL.scenes.length-1&&false);
    s.el.style.display=vis?'block':'none';
    if(!vis)return;
    const fin=i==0?ramp(lt,0,.6):ramp(lt,0,FADE);
    const fout=i==TL.scenes.length-1?1-ramp(lt,s.dur-0.6,.6):1;
    s.el.style.opacity=fin*fout; s.el.style.zIndex=i+1;
    SC[s.id].render(s.el,lt,s);
    if(lt<s.dur)cur={s,lt};
  });
  // corner mark
  const m=$('#mark'); m.style.opacity=cur&&!NOMARK[cur.s.id]?1:0;
  // background blobs drift
  if(cur){const b=BLOBS[cur.s.id];$('#blobA').style.background=b[0];$('#blobB').style.background=b[1]}
  $('#blobA').style.transform=`translate(${Math.sin(T*.2)*60}px,${Math.cos(T*.17)*40}px)`;
  $('#blobB').style.transform=`translate(${Math.cos(T*.15)*60}px,${Math.sin(T*.21)*40}px)`;
  // subtitles
  let sub='';
  if(cur){for(const [a,b,x] of cur.s.subs){if(cur.lt>=a-0.05&&cur.lt<b+0.25)sub=x}}
  const sp=$('#subs span'); sp.textContent=sub; sp.style.display=sub?'inline-block':'none';
  // phone float
  document.querySelectorAll('.phone').forEach(p=>p.style.transform=`translateY(${Math.sin(T*1.1)*6}px)`);
}
window.render=render;
render(0);
</script>
</body>
</html>
