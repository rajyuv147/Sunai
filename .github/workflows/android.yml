name: Build Android app

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases and the apk branch

jobs:
  native-tests:
    name: Sound engine tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download the RNNoise 0.2 noise-removal model
        run: bash scripts/fetch_rnnoise_model.sh 2>&1 | sed 's/^/::notice::/' || echo "::warning::RNNoise 0.2 model download failed; using 0.1.1"
      - name: Build and run the C++ sound engine tests
        run: |
          set -o pipefail
          cmake -S native-tests -B native-tests/build -DCMAKE_BUILD_TYPE=Release
          if ! cmake --build native-tests/build -j 2>&1 | tee build.log; then
            grep -E "error|Error" build.log | head -30 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          fi
          ./native-tests/build/sunai_tests 2>&1 | tee test.log || {
            grep -E "FAIL|model" test.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          grep -E "model|own voice|visitor|wearer|processed" test.log | while IFS= read -r l; do echo "::notice::$l"; done

  apk:
    name: Build APK
    runs-on: ubuntu-24.04      # comes with the Android SDK preinstalled
    needs: native-tests
    steps:
      - uses: actions/checkout@v5

      - name: Download the RNNoise 0.2 noise-removal model
        run: bash scripts/fetch_rnnoise_model.sh 2>&1 | sed 's/^/::notice::/' || echo "::warning::RNNoise 0.2 model download failed; using 0.1.1"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Point Gradle at the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          echo "Android SDK: $SDK"
          ls "$SDK" || true

      - name: Decode signing key (only if the secret is set)
        env:
          KEYSTORE_B64: ${{ secrets.SUNAI_KEYSTORE_B64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sunai.jks"
          echo "SUNAI_KEYSTORE=$RUNNER_TEMP/sunai.jks" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        env:
          SUNAI_KEYSTORE_PASSWORD: ${{ secrets.SUNAI_KEYSTORE_PASSWORD }}
          SUNAI_KEY_ALIAS: ${{ secrets.SUNAI_KEY_ALIAS }}
          SUNAI_KEY_PASSWORD: ${{ secrets.SUNAI_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain assembleDebug assembleRelease 2>&1 | tee build.log; then
            # Surface the real errors as annotations (visible on the run page and via the API).
            grep -E "^e: |error:|ERROR:|What went wrong|FAILED|> " build.log | grep -v "^> Task" | head -40 | \
              while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          fi

      - name: Report APK sizes
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/*/*.apk; do
            echo "- $(basename "$f"): $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::$(basename "$f") is $(du -h "$f" | cut -f1)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sunai-apk
          path: app/build/outputs/apk/**/*.apk

      # Publish a GitHub Release with a ready-to-install APK, and keep the latest
      # APK on the "apk" branch so it can be fetched with plain git.
      - name: Publish release and apk branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/sunai-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/sunai-${VERSION}-debug.apk"
          gh release create "$TAG" dist/*.apk \
            --title "Sunai ${VERSION} (build ${{ github.run_number }})" \
            --notes "Install **sunai-${VERSION}.apk** on the phone. Test build: signed with a test key, not for Google Play." \
            --target "${{ github.sha }}"
          cd dist
          git init -q -b apk
          git -c user.name="sunai-ci" -c user.email="ci@sunai.invalid" add .
          git -c user.name="sunai-ci" -c user.email="ci@sunai.invalid" commit -q -m "APK from ${{ github.sha }} ($TAG)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" apk
